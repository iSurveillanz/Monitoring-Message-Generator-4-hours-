<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>iSurveillanz Monitoring Message Generator</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f4f7fb;color:#1f2937}
.container{max-width:900px;margin:35px auto;padding:20px}
.card{background:#fff;border:1px solid #e2e8f0;border-radius:16px;padding:28px;box-shadow:0 8px 24px rgba(15,23,42,.08)}
h1{margin:0 0 7px;color:#173b67;font-size:27px}
.subtitle{margin:0 0 24px;color:#64748b}
.section-title{font-size:14px;font-weight:700;color:#475569;margin:18px 0 9px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:22px}
button{font-family:inherit}
.option{border:1px solid #dbe4ef;background:#f8fafc;padding:15px;border-radius:10px;cursor:pointer;font-size:15px;font-weight:700;color:#1e3a5f}
.option:hover{background:#eaf2fb}
.option.active{background:#173b67;color:#fff;border-color:#173b67}
.period-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:22px}
textarea{width:100%;min-height:315px;resize:vertical;border:1px solid #cbd5e1;border-radius:10px;padding:16px;font-size:15px;line-height:1.6;font-family:Arial,Helvetica,sans-serif;background:#fbfdff;color:#1f2937}
.actions{display:flex;gap:10px;margin-top:14px}
.copy{flex:1;border:0;border-radius:10px;padding:14px;background:#198754;color:#fff;font-size:16px;font-weight:700;cursor:pointer}
.copy:hover{background:#157347}
.reset{border:1px solid #cbd5e1;border-radius:10px;padding:14px 20px;background:#fff;color:#334155;font-weight:700;cursor:pointer}
.note{margin-top:16px;padding:12px 14px;border-radius:8px;background:#f1f5f9;color:#64748b;font-size:13px}
@media(max-width:650px){.container{margin:10px auto;padding:10px}.card{padding:18px}.grid{grid-template-columns:1fr}.period-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="container">
<div class="card">
<h1>iSurveillanz Monitoring Message Generator</h1>
<p class="subtitle">Select the client option and review period, then copy the WhatsApp message.</p>

<div class="section-title">Select Client</div>
<div class="grid">
<button class="option active" data-client="none">1. No Client</button>
<button class="option" data-client="IWI Bhopal Matrix">2. IWI Bhopal Matrix</button>
<button class="option" data-client="IWI Nashik Warehouse">3. IWI Nashik Warehouse</button>
</div>

<div class="section-title">Select Review Period</div>
<div class="period-grid">
<button class="option" data-index="0">12:00 AM – 04:00 AM</button>
<button class="option" data-index="1">04:00 AM – 08:00 AM</button>
<button class="option" data-index="2">08:00 AM – 12:00 PM</button>
<button class="option" data-index="3">12:00 PM – 04:00 PM</button>
<button class="option" data-index="4">04:00 PM – 08:00 PM</button>
<button class="option" data-index="5">08:00 PM – 12:00 AM</button>
</div>

<div class="section-title">WhatsApp Message</div>
<textarea id="message" readonly></textarea>

<div class="actions">
<button class="copy" id="copyBtn">📋 Copy WhatsApp Message</button>
<button class="reset" id="resetBtn">Reset</button>
</div>

<div class="note">For “No Client”, no location line is added. For the two IWI options, the selected location is added automatically.</div>
</div>
</div>

<script>
const periods=[
["12:00 AM to 4:00 AM","4:00 AM to 8:00 AM","8:30 AM"],
["4:00 AM to 8:00 AM","8:00 AM to 12:00 PM","12:30 PM"],
["8:00 AM to 12:00 PM","12:00 PM to 4:00 PM","4:30 PM"],
["12:00 PM to 4:00 PM","4:00 PM to 8:00 PM","8:30 PM"],
["4:00 PM to 8:00 PM","8:00 PM to 12:00 AM","12:30 AM"],
["8:00 PM to 12:00 AM","12:00 AM to 4:00 AM","4:30 AM"]
];

let selectedClient="none";
let selectedPeriod=0;

const clientButtons=document.querySelectorAll('[data-client]');
const periodButtons=document.querySelectorAll('[data-index]');
const messageBox=document.getElementById("message");
const copyBtn=document.getElementById("copyBtn");
const resetBtn=document.getElementById("resetBtn");

function buildMessage(){
const [lastReview,nextReview,nextUpdate]=periods[selectedPeriod];
const locationLine=selectedClient==="none" ? "" : `📍 Location: ${selectedClient}\n\n`;
messageBox.value=`Dear Madam/Sir,

${locationLine}🕘 Last Review: ${lastReview}
✅ Status: No abnormal activity was detected during this review.

📌 Next Review: ${nextReview}
📩 Next Update: The monitoring status will be shared at ${nextUpdate} after the review.

Thanks & Regards,
iSurveillanz Team`;
}

clientButtons.forEach(btn=>{
btn.addEventListener("click",()=>{
selectedClient=btn.dataset.client;
clientButtons.forEach(b=>b.classList.remove("active"));
btn.classList.add("active");
buildMessage();
});
});

periodButtons.forEach(btn=>{
btn.addEventListener("click",()=>{
selectedPeriod=Number(btn.dataset.index);
periodButtons.forEach(b=>b.classList.remove("active"));
btn.classList.add("active");
buildMessage();
});
});

copyBtn.addEventListener("click",async()=>{
try{await navigator.clipboard.writeText(messageBox.value)}
catch(e){messageBox.select();document.execCommand("copy")}
copyBtn.textContent="✅ Message Copied";
setTimeout(()=>copyBtn.textContent="📋 Copy WhatsApp Message",1800);
});

resetBtn.addEventListener("click",()=>{
selectedClient="none";
selectedPeriod=0;
clientButtons.forEach((b,i)=>b.classList.toggle("active",i===0));
periodButtons.forEach((b,i)=>b.classList.toggle("active",i===0));
buildMessage();
});

buildMessage();
</script>
</body>
</html>
